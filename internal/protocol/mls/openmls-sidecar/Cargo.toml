[package]
name = "carbonstack_openmls_sidecar"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4"
openmls = "0.8.1"
openmls_basic_credential = "0.5.0"
openmls_memory_storage = { version = "0.5.0", features = ["persistence"] }
openmls_rust_crypto = "0.5.1"
openmls_traits = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tls_codec = "0.4.2"


